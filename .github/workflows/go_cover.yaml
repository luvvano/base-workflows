# Reusable workflow: enforce a minimum Go coverage for the luvvano organization.
#
# Takes the coverage percentage produced by go_unit.yaml and fails (red check)
# when it is below `required_minimum_coverage`. This is a separate check from the
# unit tests, so a PR shows two independent statuses: the tests and the coverage
# gate.
#
# It intentionally needs NO elevated token permissions: the pass/fail verdict is
# the job status itself, so it works even when the repository's default
# GITHUB_TOKEN is read-only. (A job that requests `checks: write` /
# `pull-requests: write` above a read-only default silently fails to start and
# never posts a status — which is exactly how a low-coverage PR could look green.)

name: coverage

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        description: Runner label for the job.
        required: false
        default: ubuntu-latest
      unit_tests_coverage:
        type: number
        description: Coverage percentage produced by the unit tests.
        required: false
        default: 0
      required_minimum_coverage:
        type: number
        description: >-
          Minimum coverage percentage. When the measured coverage is below this
          value the job fails. Set to 0 to disable the gate.
        required: false
        default: 0
    outputs:
      coverage:
        description: The coverage percentage that was checked.
        value: ${{ inputs.unit_tests_coverage }}

jobs:
  minimum_coverage:
    name: minimum coverage
    runs-on: ${{ inputs.runs_on }}

    env:
      COVERAGE: ${{ inputs.unit_tests_coverage }}
      MINIMUM: ${{ inputs.required_minimum_coverage }}

    steps:
      - name: Check coverage meets the required minimum
        shell: bash
        run: |
          echo "Current coverage: ${COVERAGE}%"
          echo "Required minimum: ${MINIMUM}%"

          {
            echo "### Coverage"
            echo ""
            echo "| Metric           | Value     |"
            echo "|------------------|-----------|"
            echo "| Current coverage | ${COVERAGE}% |"
            echo "| Required minimum | ${MINIMUM}% |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Float-safe comparison via awk. Fails (exit 1) when coverage < minimum.
          if awk "BEGIN { exit !(${COVERAGE:-0} < ${MINIMUM:-0}) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the required minimum ${MINIMUM}%"
            echo "❌ **Coverage ${COVERAGE}% is below the required minimum ${MINIMUM}%.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Coverage ${COVERAGE}% meets the required minimum ${MINIMUM}%."
          echo "✅ Coverage ${COVERAGE}% meets the required minimum ${MINIMUM}%." >> "$GITHUB_STEP_SUMMARY"
